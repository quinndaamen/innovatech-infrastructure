services:

  web:
    image: innovatech-web:latest

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "8000"


  nginx:
    image: innovatech-nginx:latest

    ports:
      - "8080:80"

    depends_on:
      - web