<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact - Innovatech</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #17202a;
        }

        header {
            background: #111827;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
        }

        .form-container {
            background: white;
            margin: 70px auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 25px;
            padding: 14px 24px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <a href="/">
        Home
    </a>

    <a href="/form">
        Contact
    </a>

    <a href="/submissions">
        Submissions
    </a>

</header>


<div class="container">

    <div class="form-container">

        <h1>
            Get in touch
        </h1>

        <p>
            Submit your information below.
        </p>


        <form
            method="POST"
            action="/submit"
        >

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="255"
                required
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required
            ></textarea>


            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</div>

</body>

</html>
