apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: innovatech-gateway
  namespace: gateway
  annotations:
    # Certificate Manager map that holds the HTTPS certificates
    networking.gke.io/certmap: innovatech-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: innovatech-address          # the global static IP from Terraform (dns.tf)
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All                      # routes live in keycloak, portal and desktops