# Sends keycloak.innovatech.qvnn.me to the Keycloak service, through the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: innovatech-gateway
      namespace: gateway
  hostnames:
    - keycloak.innovatech.qvnn.me
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
---
# The load balancer's default health check requests "/" and expects HTTP 200.
# Keycloak redirects "/", so point the check at a path that returns 200.
# Check the GKE HealthCheckPolicy docs if the fields are rejected.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: keycloak
  namespace: keycloak
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /realms/master
  targetRef:
    group: ""
    kind: Service
    name: keycloak
