apiVersion: v1
kind: Service
metadata:
  name: hr-staff-desktop
  namespace: desktops
spec:
  type: ClusterIP            # only reachable inside the cluster (we use port-forward to test)
  selector:
    app: hr-staff-desktop    # sends traffic to pods with this label
  ports:
    - port: 3000             # port of the Service
      targetPort: 3000       # port of the container
