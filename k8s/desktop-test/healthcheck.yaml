apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: jan-desktop-healthcheck
  namespace: desktops
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 4180
        requestPath: /ping
  targetRef:
    group: ""
    kind: Service
    name: hr-staff-desktop