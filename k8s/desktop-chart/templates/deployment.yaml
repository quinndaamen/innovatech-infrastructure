apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "desktop.name" . }}
  labels:
    {{- include "desktop.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate            # a disk attaches to one pod only
  selector:
    matchLabels:
      {{- include "desktop.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "desktop.selector" . | nindent 8 }}
        {{- include "desktop.labels" . | nindent 8 }}
    spec:
      nodeSelector:
        workload: {{ .Values.nodePool }}
      tolerations:
        - key: workload
          operator: Equal
          value: {{ .Values.nodePool }}
          effect: NoSchedule

      containers:
        - name: desktop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: home
              mountPath: /config
            - name: shm
              mountPath: /dev/shm

        {{- if .Values.auth.enabled }}
        - name: oauth2-proxy
          image: {{ .Values.auth.proxyImage }}
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url={{ .Values.auth.issuerUrl }}
            - --client-id={{ .Values.auth.clientId }}
            - --redirect-url=https://{{ include "desktop.hostname" . }}/oauth2/callback
            - --upstream=http://127.0.0.1:3000
            - --http-address=0.0.0.0:4180
            - --allowed-group={{ .Values.group }}
            - --authenticated-emails-file=/etc/owner/emails
            - --cookie-secure=true
            - --reverse-proxy=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.clientSecretName }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "desktop.cookieSecret" . }}
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          volumeMounts:
            - name: owner
              mountPath: /etc/owner
              readOnly: true
        {{- end }}

      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "desktop.home" . }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        {{- if .Values.auth.enabled }}
        - name: owner
          configMap:
            name: owner-{{ include "desktop.user" . }}
        {{- end }}