apiVersion: v1
kind: Service
metadata:
  name: {{ include "desktop.name" . }}
  labels:
    {{- include "desktop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "desktop.selector" . | nindent 4 }}
  ports:
    - port: {{ include "desktop.servicePort" . }}
      targetPort: {{ include "desktop.servicePort" . }}