name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        working-directory: dev-web/App
        run: docker build -t innovatech-app:test .

      - name: Test application image
        run: docker run --rm innovatech-app:test python -c "import app; print('Application import successful')"